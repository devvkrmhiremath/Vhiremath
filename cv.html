:root {
  --bg: #EDF1F5; --bg-elevated: #FFFFFF; --ink: #16233B; --ink-soft: #47597A;
  --ink-faint: #7488A8; --line: #2E4A7A; --line-faint: rgba(46,74,122,0.18);
  --accent: #BD3B1D; --accent-ink: #ffffff;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'Cascadia Code', 'SF Mono', 'Roboto Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0E2444; --bg-elevated:#14304F; --ink:#DEE9F6; --ink-soft:#A0BAD8; --ink-faint:#7592B5; --line:#6FA8D8; --line-faint:rgba(111,168,216,0.22); --accent:#FF7D4E; --accent-ink:#17233c; }
}
:root[data-theme="dark"] { --bg:#0E2444; --bg-elevated:#14304F; --ink:#DEE9F6; --ink-soft:#A0BAD8; --ink-faint:#7592B5; --line:#6FA8D8; --line-faint:rgba(111,168,216,0.22); --accent:#FF7D4E; --accent-ink:#17233c; }
:root[data-theme="light"] { --bg:#EDF1F5; --bg-elevated:#FFFFFF; --ink:#16233B; --ink-soft:#47597A; --ink-faint:#7488A8; --line:#2E4A7A; --line-faint:rgba(46,74,122,0.18); --accent:#BD3B1D; --accent-ink:#ffffff; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background:
    repeating-linear-gradient(0deg, var(--line-faint) 0px, var(--line-faint) 1px, transparent 1px, transparent 32px) ,
    repeating-linear-gradient(90deg, var(--line-faint) 0px, var(--line-faint) 1px, transparent 1px, transparent 32px),
    var(--bg);
  background-blend-mode: normal;
  color: var(--ink); font-family: var(--font-body); padding: 24px;
}
.card {
  max-width: 560px; width: 100%; background: var(--bg-elevated); border: 1px solid var(--line-faint);
  border-radius: 4px; padding: 40px 38px; box-shadow: 0 8px 24px rgba(22,35,59,0.08);
}
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); display:flex; align-items:center; gap:10px; margin-bottom: 18px; }
.eyebrow::before { content:""; width: 26px; height: 1px; background: var(--accent); display:inline-block; }
h1 { font-family: var(--font-display); text-transform: uppercase; font-size: 2.1rem; margin: 0 0 6px; letter-spacing: 0.01em; }
p { color: var(--ink-soft); line-height: 1.6; }
.note { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-faint); border-top: 1px dashed var(--line-faint); margin-top: 22px; padding-top: 16px; }
.links { display:flex; gap: 14px; flex-wrap: wrap; margin-top: 24px; }
.btn { font-family: var(--font-mono); font-size: 0.82rem; text-decoration:none; padding: 11px 18px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
a { color: var(--ink-soft); }
</style>
